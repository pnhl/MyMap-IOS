name: iOS source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_simulator:
        description: Build native iOS Simulator app (requires FIREBASE_IOS_PLIST_BASE64)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx expo config --type public > /dev/null
  swift-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all native Swift sources
        run: find modules -name '*.swift' -print0 | xargs -0 xcrun swiftc -parse
  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.build_simulator
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Read private Firebase iOS configuration
        run: |
          test -n "$FIREBASE_IOS_PLIST_BASE64" || { echo 'Configure FIREBASE_IOS_PLIST_BASE64 first.'; exit 1; }
          printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
      - run: npm run prepare:ios
      - run: npm run build:ios:simulator
